# Lancer local K8s fixtures (k3d)
# Intentionally broken resources for GUI testing.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lancer-fixtures
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-web
  namespace: lancer-fixtures
  labels:
    app: healthy-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthy-web
  template:
    metadata:
      labels:
        app: healthy-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-web
  namespace: lancer-fixtures
spec:
  selector:
    app: healthy-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthy-web
  namespace: lancer-fixtures
spec:
  rules:
    - host: healthy.lancer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthy-web
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: lancer-fixtures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
        - name: boom
          image: busybox:1.36
          command: ["sh", "-c", "echo crash; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-demo
  namespace: lancer-fixtures
spec:
  nodeSelector:
    lancer.io/never-schedule: "true"
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
  namespace: lancer-fixtures
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo app-ok; sleep 5; done"]
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo sidecar-ok; sleep 7; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-readiness
  namespace: lancer-fixtures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-readiness
  template:
    metadata:
      labels:
        app: bad-readiness
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /this-path-does-not-exist
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 3
            failureThreshold: 1
