[package]
name = "lancer"
version = "0.1.0"
description = "Lancer — Desktop First DevOps / Kubernetes workbench"
authors = ["lancer"]
edition = "2021"

[lib]
name = "lancer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
futures-util = "0.3"
kube = { version = "0.98", default-features = false, features = ["client", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
bollard = "0.18"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
urlencoding = "2"
